name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and API regression tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
